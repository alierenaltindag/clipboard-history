name: Release & Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      draft:
        description: "Draft release before publishing"
        type: boolean
        default: false

jobs:
  build-packages:
    name: Build Multi-Distro Packages (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            rpm_arch: x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libx11-dev libxtst-dev pkg-config dpkg-dev rpm

      - name: Build Release Binaries
        run: cargo build --release --workspace

      - name: Build Debian Package (.deb)
        run: ./packaging/deb/build-deb.sh

      - name: Build Tarball (.tar.gz)
        run: |
          VERSION="${{ github.ref_name || inputs.version }}"
          VERSION="${VERSION#v}"
          TAR_DIR="clipboard-history-${VERSION}-${{ matrix.target }}"
          mkdir -p "${TAR_DIR}"
          cp target/release/clipboard-history "${TAR_DIR}/"
          cp target/release/clipboard-history-daemon "${TAR_DIR}/"
          cp target/release/clipboard-history-gui "${TAR_DIR}/"
          cp scripts/install.sh "${TAR_DIR}/"
          cp scripts/uninstall.sh "${TAR_DIR}/"
          cp -r packaging "${TAR_DIR}/"
          cp README.md LICENSE "${TAR_DIR}/"
          tar -czf "target/${TAR_DIR}.tar.gz" "${TAR_DIR}"

      - name: Generate SHA-256 Checksums
        run: |
          cd target
          sha256sum *.deb *.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: |
            target/*.deb
            target/*.tar.gz
            target/SHA256SUMS.txt
