[package]
name = "clipboard-history-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "chrono", "blob"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1.11"
directories = "5.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.40", features = ["sync", "io-util", "net", "macros", "fs", "rt", "time", "process"] }
tempfile = "3.13"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
urlencoding = "2.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
similar = { version = "2.6", features = ["inline"] }
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
async-trait = "0.1"
which = "7.0"
x11rb = { version = "0.13", features = ["xtest", "allow-unsafe-code"] }
libc = "0.2"
semver = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tar = "0.4"
flate2 = "1.0"

[dev-dependencies]
tempfile = "3.13"
